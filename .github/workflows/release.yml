name: Release

on:
  workflow_run:
    workflows: ["Build Executables"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID to release from. If blank, finds latest run for the tag."
        required: false
        type: string
      tag:
        description: "Release tag name. If blank, inferred from the build run."
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Asset sets and latest.json must never be interleaved by concurrent reruns.
concurrency:
  group: fox-reader-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare Release Draft
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Run ID and Tag
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            if [ -z "$INPUT_TAG" ]; then
              echo "Error: Either run_id or tag must be provided when manually dispatching." >&2
              exit 1
            fi
            echo "Searching latest 'Build Executables' run for branch/tag '$INPUT_TAG'..."
            RUN_ID=$(gh run list --workflow "Build Executables" --branch "$INPUT_TAG" --status success --limit 1 --json databaseId -q ".[0].databaseId")
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "Error: Could not find any workflow run for '$INPUT_TAG'." >&2
              exit 1
            fi
          fi

          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run ID" >&2; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > build_run.json
          EXPECTED_WORKFLOW=$(gh api "repos/$REPOSITORY/actions/workflows/build.yml" --jq .id)
          jq -e --arg repository "$REPOSITORY" --argjson workflow "$EXPECTED_WORKFLOW" \
            '.conclusion == "success" and .status == "completed" and .workflow_id == $workflow and
             .head_repository.full_name == $repository and (.event == "push" or .event == "workflow_dispatch")' \
            build_run.json > /dev/null

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(jq -r .head_branch build_run.json)
          fi

          # Strip refs/tags/ if present
          TAG="${TAG#refs/tags/}"

          echo "Target Run ID: $RUN_ID"
          echo "Target Tag:    $TAG"

          # Verify that TAG is a git tag (skip if build was just a branch push)
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::notice ::Target '$TAG' is not a git tag. Release publishing skipped."
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run_id/tag pair must refer to the exact same source.
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$(jq -r .head_sha build_run.json)" ]] || {
            echo "Tag commit does not match the successful build" >&2; exit 1;
          }
          [[ "$TAG" =~ ^v?[0-9][A-Za-z0-9.+_-]*$ ]] || { echo "Release tag must be a version" >&2; exit 1; }

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_tag=true" >> "$GITHUB_OUTPUT"

      # Download whole archives (uploaded with archive: false)
      - name: Download whole archives
        if: steps.target.outputs.is_tag == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: fox-reader-*
          path: artifacts/
          merge-multiple: true
          skip-decompress: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Download split parts (uploaded as wrapped artifacts, unwrap them)
      - name: Download split parts
        if: steps.target.outputs.is_tag == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: parts-*
          path: artifacts/
          merge-multiple: true
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        if: steps.target.outputs.is_tag == 'true'
        run: ls -lh artifacts/

      - name: Download build-time checksum manifests
        if: steps.target.outputs.is_tag == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: checksums-*
          path: checksums/
          merge-multiple: false
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release notes
        if: steps.target.outputs.is_tag == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          cat << 'EOF' > release_body.md
          ## What to download

          Pick the archive matching your OS and GPU, extract it anywhere,
          and start `launcher` (`launcher.exe` on Windows).

          | Your machine | Download |
          |---|---|
          | Windows or Linux, no NVIDIA GPU | the `cpu` archive for your OS (runs anywhere) |
          | Apple Silicon, macOS 14+ | the `macos` / `macos-arm64` archive when listed (Torch MPS and llama.cpp Metal) |
          | NVIDIA GPU | the `cuXXX` archive matching your card (`cu118` older, `cu126`/`cu129` current, `cu130` newest). CUDA builds need that CUDA driver installed |
          | Only OCR/typesetting, no local translation | a build *without* `gguf` in its name (smaller, no translator backend) |
          | Local GGUF translation models | a build *with* `gguf` in its name (bundled llama.cpp, no toolchain needed) |

          Archive names read as
          `fox-reader-v{version}-{device}[-gguf]-{platform}`:
          `cpu` = PyTorch backend, `gguf` = translator backend included,
          `windows-x64` = `.zip`, `linux-x64` / `macos-arm64` = `.tar.gz`. Missing your
          combination? Build it yourself with
          [`packaging/build.md`](../blob/master/packaging/build.md).

          Mac artifacts are built on GitHub-hosted ARM64 runners and target
          Apple Silicon with macOS 14 or newer. Torch MPS and llama.cpp Metal
          support are included; GPU execution is untested when the hosted runner
          exposes no GPU. Mac binaries are ad-hoc signed; Developer ID signing
          and notarization are separate, so a downloaded build may need approval
          in Privacy & Security.

          ### Downloads in parts (`.001`, `.002`, …)

          The larger CUDA builds are 3-4 GB, so those are split into ~1 GB parts.
          If the download you want is listed as `….zip.001`, `….zip.002`, … then
          **get every part** and join them back into one file first — they are not
          separate archives and none of them opens on its own.

          **Windows** (PowerShell or Command Prompt, in the download folder):

          ```
          cmd /c "copy /b fox-reader-….zip.001+fox-reader-….zip.002+… fox-reader-….zip"
          ```

          **Linux / macOS**:

          ```
          cat fox-reader-….tar.gz.* > fox-reader-….tar.gz
          ```

          Then extract the joined file as usual and delete the parts.

          ### Checking your download

          `SHA256SUMS.txt` lists every archive and numbered part attached here. Verify with
          `sha256sum -c SHA256SUMS.txt` (Linux),
          `shasum -a 256 -c SHA256SUMS.txt` (macOS), or
          `Get-FileHash <file> -Algorithm SHA256` (Windows) and compare. For a
          split download, the `#` line naming the archive gives the digest of
          the **joined** file, so you can check the result of the step above.

          Where available, a signed GitHub build attestation verifies that an
          archive or part was produced by this repository's workflow:

          ```
          gh attestation verify <file> --repo ${{ github.repository }}
          ```

          `latest.json` is the update index: it includes release notes, platform
          variants, ordered part URLs, sizes, and SHA256 digests. New desktop
          builds can check and download a matching update from Settings. Install
          into a new folder and copy your config, fonts, and models; keep the
          previous installation until the new version works.
          EOF
          python packaging/release_notes.py --changelog CHANGELOG.md --tag "$TAG" \
            --download-notes release_body.md --output complete_release_body.md

      - name: Validate downloads and generate latest.json
        if: steps.target.outputs.is_tag == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > build-jobs.json
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > build-artifacts.json
          python packaging/release_manifest.py generate \
            --artifacts artifacts --checksums checksums --repository "$REPOSITORY" --tag "$TAG" \
            --notes-file complete_release_body.md --output artifacts/latest.json \
            --build-jobs-json build-jobs.json --build-artifacts-json build-artifacts.json \
            --require-platform linux --require-platform windows --require-platform macos

      - name: Create or resume draft release
        if: steps.target.outputs.is_tag == 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="Fox Reader v${TAG#v}"
          # Classify the draft now so manual publication keeps prereleases
          # out of the stable /releases/latest pointer.
          release_flags=(--prerelease=false)
          if ! [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Published releases are immutable. Create a new version to replace assets." >&2
              exit 1
            fi
            gh release edit "$TAG" --title "$TITLE" -F complete_release_body.md \
              --draft "${release_flags[@]}"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              -F complete_release_body.md \
              --verify-tag \
              --draft "${release_flags[@]}"
          fi

          # The REST release-by-tag endpoint does not return drafts. The CLI
          # can find them and supplies the numeric ID for the assets endpoint.
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid draft release ID" >&2; exit 1; }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload assets sequentially
        if: steps.target.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(artifacts/fox-reader-*-windows-x64.zip artifacts/fox-reader-*-linux-x64.tar.gz artifacts/fox-reader-*-macos-arm64.tar.gz artifacts/fox-reader-*.[0-9][0-9][0-9] artifacts/SHA256SUMS.txt artifacts/latest.json)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No release assets found to upload." >&2
            exit 1
          fi

          echo "Found ${#files[@]} assets to upload."

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            echo "----------------------------------------------------"
            echo "Uploading $filename ($size)..."

            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "Successfully uploaded $filename"
                uploaded=true
                break
              else
                echo "Upload attempt $attempt failed for $filename. Retrying in 10s..."
                sleep 10
              fi
            done

            if [ "$uploaded" != "true" ]; then
              echo "Error: Failed to upload $filename after 3 attempts." >&2
              exit 1
            fi
          done

          echo "===================================================="
          echo "All release assets uploaded successfully."

      - name: Verify uploaded assets and leave draft for review
        if: steps.target.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > uploaded-assets.json
          python packaging/release_manifest.py verify-assets --manifest artifacts/latest.json --assets-json uploaded-assets.json
          RELEASE_URL=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "## Release draft ready for review"
            echo
            echo "All release assets passed inventory, size, and SHA256 verification."
            echo
            echo "[Review the $TAG draft]($RELEASE_URL), then select **Publish release** when you approve it."
            echo "The workflow leaves the release as a draft; publication is manual."
          } >> "$GITHUB_STEP_SUMMARY"
